<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="闲鱼智能监控">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- 监控雷达弧线 -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M22 62a42 42 0 0 1 42-42"/>
    <path d="M22 78a58 58 0 0 1 58-58" stroke-opacity="0.3"/>
  </g>
  <circle cx="64" cy="64" r="6" fill="#38bdf8" fill-opacity="0.9"/>

  <!-- 闲鱼主体 -->
  <g transform="translate(60 70)">
    <path d="M-34 0c10-16 28-24 44-20 8 2 13 7 16 13 4 8 3 17-3 24-8 9-22 13-35 10C-24 24-32 16-34 6z" fill="url(#fish)"/>
    <path d="M-34 2l-16-14c-2 8-2 18 2 26 2 4 6 6 10 4z" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="4" cy="-4" r="4.6" fill="#0f172a"/>
    <circle cx="5.6" cy="-5.6" r="1.5" fill="#fff" fill-opacity="0.9"/>
    <path d="M8 8c8 2 16 0 22-5" fill="none" stroke="#b45309" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 价格标签 -->
  <g transform="translate(88 34)">
    <rect x="-22" y="-13" width="46" height="26" rx="8" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.65" stroke-width="2"/>
    <text x="1" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">¥</text>
  </g>
</svg>
