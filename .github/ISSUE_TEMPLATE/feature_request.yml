name: 功能建议
description: 提出一个新功能或改进（不适用于 bug，bug 请用 Bug 报告）
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看三条边界，落在边界外的不会被实现：
        - 不提升抓取频率、不绕过验证码
        - 不内置代理池 / 打码 / 账号池服务
        - 不把登录态上传到任何中心服务

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: 描述场景，不要直接给方案。方案由维护者和你一起定。
      placeholder: |
        我同时跑 5 个任务，每天有 200 条候选。现在只能按综合评分排序，
        但我更关心「降价了」的商品，只能一条条翻。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      placeholder: 候选列表增加「较上次抓取降价」筛选，并在卡片上显示降幅。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括「不用改代码的临时办法」，有时这才是更好的答案。

  - type: dropdown
    id: cost
    attributes:
      label: 对请求量的影响（重要）
      description: 这个功能会不会让每轮多抓页面、多调 AI、多占内存？
      options:
        - 不增加请求量（纯前端/纯本地计算）
        - 略微增加（可接受）
        - 明显增加（需要讨论）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提 PR 实现它
        - label: 我可以帮忙测试和补充文档
