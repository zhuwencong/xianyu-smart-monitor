name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: 仓库卫生与敏感信息
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 禁止提交的路径
        run: |
          set -e
          forbidden='^(\.env$|\.env\..*|state/|data/|logs/|images/|jsonl/|price_history/|config\.json$|cookies\.tmp$|\.tmp/|pytest-of-[^/]+/)'
          if git ls-files | grep -Ev '^\.env\.example$' | grep -E "$forbidden"; then
            echo "::error::检测到不应提交的运行时文件或凭据文件"
            exit 1
          fi
          echo "OK: 未发现被跟踪的敏感路径"

      - name: 扫描硬编码密钥
        run: |
          set -e
          if git grep -nE 'sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----' -- \
              ':!*.lock' ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "::error::疑似硬编码密钥，请改用环境变量"
            exit 1
          fi
          echo "OK: 未发现硬编码密钥"

      - name: 校验插件与市场索引
        run: |
          node --check plugins/dsh/index.js
          node --check scripts/build-market-index.mjs
          node --check scripts/validate-market-index.mjs
          node scripts/validate-market-index.mjs market/index.json
          node scripts/check-plugin-versions.mjs
          node -e "JSON.parse(require('fs').readFileSync('plugins/dsh/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('config.json.example','utf8'))"
          echo "OK: 插件清单与市场索引格式正确"

      - name: 检查 WorkBuddy 技能包结构
        run: |
          test -f plugins/workbuddy/xianyu-monitor/SKILL.md
          test -f plugins/workbuddy/xianyu-monitor/scripts/xy.py
          grep -q '^name:' plugins/workbuddy/xianyu-monitor/SKILL.md
          grep -q '^display_name_en:' plugins/workbuddy/xianyu-monitor/SKILL.md
          grep -q '^author:' plugins/workbuddy/xianyu-monitor/SKILL.md
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('plugins/workbuddy/xianyu-monitor/scripts/xy.py').read_text(encoding='utf-8'))"
          echo "OK: 技能包结构与 frontmatter 必填字段齐全"

      - name: Python 语法检查（含维护脚本）
        run: |
          python3 -m compileall -q src scripts
          echo "OK: src 与 scripts 均可编译"

  backend:
    name: 后端测试 (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          OPENAI_API_KEY: sk-test-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1/
          OPENAI_MODEL_NAME: test-model
        run: pytest -q

  frontend:
    name: 前端构建 (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: 确认构建产物存在
        run: |
          test -f dist/index.html && echo "OK: dist/index.html"

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: xianyu-smart-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
